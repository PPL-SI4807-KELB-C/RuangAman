name: RuangAman CI / Automated Quality Check

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  laravel-tests:
    name: PHP 8.3 & Laravel Verification
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: ruangaman_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ruangaman_testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, pdo_sqlite, bcmath, fileinfo
        coverage: none

    - name: Copy environment file
      run: cp .env.example .env

    - name: Install Composer dependencies
      run: composer install --no-interaction --prefer-dist --no-progress

    - name: Generate application key
      run: php artisan key:generate

    - name: Validate composer.json
      run: composer validate --strict

    - name: Check PHP Syntax (Linting)
      run: find app config database routes -type f -name "*.php" -exec php -l {} +

    - name: Run migrations against MySQL 8
      run: php artisan migrate --force

    - name: Run test suite
      run: php artisan test
